<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>手机 CF IP 优选工具</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      padding: 12px;
      padding-bottom: 40px;
    }
    .container { max-width: 960px; margin: 0 auto; }
    header {
      position: relative;
      text-align: center;
      padding: 18px 0 22px;
      background: transparent;
      border: 0;
      box-shadow: none;
    }
    .app-menu-wrap { position: absolute; top: 10px; right: 0; z-index: 20; }
    .app-menu-button { width: 38px; height: 38px; border: 1px solid #334155; border-radius: 10px; background: #1e293b; color: #e2e8f0; font-size: 23px; line-height: 1; display: grid; place-items: center; cursor: pointer; }
    .app-menu-button:active { background: #334155; }
    .app-menu { display: none; position: absolute; top: 44px; right: 0; min-width: 142px; padding: 5px; border: 1px solid #334155; border-radius: 12px; background: #1e293b; color: #e2e8f0; box-shadow: 0 12px 30px rgba(0,0,0,.35); }
    .app-menu.open { display: block; }
    .app-menu button { display: block; width: 100%; padding: 11px 12px; text-align: left; border: 0; border-radius: 7px; background: transparent; color: #e2e8f0; font-size: .9rem; }
    .app-menu button:hover, .app-menu button:focus-visible, .app-menu button:active { background: #334155; }
    .header-brand {
      width: fit-content;
      max-width: calc(100% - 44px);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: left;
    }
    .app-mark {
      width: 58px;
      height: 58px;
      flex: 0 0 58px;
      margin: 0;
      display: block;
      overflow: hidden;
      border-radius: 15px;
      background: #123f91;
      box-shadow: 0 6px 18px rgba(18, 63, 145, 0.24);
    }
    .app-mark svg { display: block; width: 100%; height: 100%; }
    .header-copy { min-width: 0; }
    header h1 {
      font-size: 1.35rem;
      font-weight: 750;
      letter-spacing: 0.04em;
      color: #f1f5f9;
      line-height: 1.3;
    }
    header p { color: var(--muted); font-size: 0.8rem; margin-top: 3px; line-height: 1.4; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }
    .row:last-child { margin-bottom: 0; }

    select, button, input {
      font-size: 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      padding: 8px 12px;
      outline: none;
    }
    select { flex: 1; min-width: 120px; }
    button {
      cursor: pointer;
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      font-weight: 500;
      transition: background 0.15s;
      white-space: nowrap;
    }
    button:hover { background: var(--primary-hover); }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    button.secondary {
      background: transparent;
      border-color: var(--border);
      color: var(--text);
    }
    button.secondary:hover { background: #334155; }
    button.success { background: var(--success); border-color: var(--success); }
    button.danger { background: var(--danger); border-color: var(--danger); }
    button.warning { background: var(--warning); border-color: var(--warning); color: #000; }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .main-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: stretch;
      column-gap: 8px;
      margin-top: 10px;
      margin-bottom: 16px;
    }
    #btnLoad { grid-column: 1 / span 2; }
    #btnOptimize { grid-column: 3; }
    .main-actions button,
    .selection-actions button {
      width: 100%;
      min-width: 0;
      height: 40px;
      padding: 8px 4px;
    }
    .selection-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: stretch;
      gap: 8px;
    }
    /* 第二行与第一行共用相同的三列宽度；上传选中固定对齐在优选延迟正下方。 */
    #btnTop3 { grid-column: 1; background: #2563eb; border-color: #2563eb; color: #fff; }
    #btnTop3:hover { background: #1d4ed8; border-color: #1d4ed8; }
    #btnAppend { grid-column: 2; width: 100%; height: 40px; padding: 8px 4px; background: #0d9488; border-color: #0d9488; color: #fff; }
    #btnAppend:hover { background: #0f766e; border-color: #0f766e; }
    #btnUpload { grid-column: 3; width: 100%; height: 40px; padding: 8px 4px; }
    #btnOptimize.optimizing, #btnOptimize.optimizing:hover { background: var(--danger); border-color: var(--danger); color: #fff; }
    @media (max-width: 420px) {
      .main-actions, .selection-actions { column-gap: 8px; }
      .main-actions button, .selection-actions button { font-size: 0.82rem; }
    }

    .status {
      font-size: 0.85rem;
      color: var(--muted);
      min-height: 1.4em;
      margin-top: 8px;
    }
    .filter-hint { font-size: 0.7rem; line-height: 1.25; margin: 0 0 4px; }
    .status.error { color: var(--danger); }
    .status.ok { color: var(--success); }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    th, td {
      padding: 8px 6px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th {
      color: var(--muted);
      font-weight: 500;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    tr:hover td { background: rgba(59, 130, 246, 0.06); }
    /* 手动填写独立栏：固定两行，不影响原版 IP 结果表样式。 */
    .manual-card { padding: 7px 9px; margin-bottom: 10px; }
    .manual-card .card-title { margin-bottom: 5px; font-size: .8rem; }
    .manual-form { display: grid; grid-template-columns: 20px minmax(120px, 1fr) calc((100% - 20px) / 5); align-items: center; gap: 5px; }
    .manual-form input:not([type="checkbox"]) { display: block; width: 100%; min-width: 0; box-sizing: border-box; padding: 4px 5px; font-size: .75rem; border-radius: 5px; }
    .manual-form .manual-ip { min-width: 120px; font-family: ui-monospace, monospace; }
    .manual-form .manual-check { display: flex; justify-content: center; align-items: center; }
    .manual-second-row { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start; gap: 5px; }
    .manual-form .manual-measure { min-width: 0; }
    .manual-form button { width: 100%; min-width: 0; padding: 4px 3px; font-size: .75rem; }
    .manual-form .manual-action button { background: #2563eb; border-color: #2563eb; color: #fff; }
    .manual-form .manual-action button:hover { background: #1d4ed8; border-color: #1d4ed8; }
    .manual-speed-status { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (max-width: 380px) {
      .manual-card { padding: 6px 7px; }
      .manual-form { grid-template-columns: 18px minmax(120px, 1fr) calc((100% - 16px) / 5); gap: 4px; }
      .manual-second-row { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
      .manual-form input:not([type="checkbox"]) { padding: 4px 3px; font-size: .72rem; }
      .manual-form button { padding: 4px 3px; font-size: .72rem; }
    }
    td.num { font-variant-numeric: tabular-nums; }
    .ip { font-family: ui-monospace, monospace; font-size: 0.8rem; }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 0.7rem;
      background: #334155;
    }
    .badge.ok { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .badge.fail { background: rgba(239, 68, 68, 0.2); color: #f87171; }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .pagination button {
      min-width: 36px;
      padding: 6px 10px;
    }
    .pagination span { color: var(--muted); font-size: 0.85rem; }

    .actions { display: flex; gap: 4px; }
    .actions button { padding: 4px 8px; font-size: 0.75rem; }

    .checkbox {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
    }

    .empty {
      text-align: center;
      padding: 30px 10px;
      color: var(--muted);
    }

    #speedSortHeader { cursor: pointer; user-select: none; white-space: nowrap; }
    #speedSortHeader:focus { outline: 2px solid var(--primary); outline-offset: 2px; }
    @media (max-width: 600px) {
      header h1 { font-size: 1.2rem; }
      th, td { padding: 7px 5px; }
      table { font-size: 0.78rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="app-menu-wrap">
        <button class="app-menu-button" id="appMenuButton" aria-label="打开菜单" aria-expanded="false">⋮</button>
        <div class="app-menu" id="appMenu" role="menu">
          <button type="button" role="menuitem" id="uploadConfigMenu">上传配置</button>
          <button type="button" role="menuitem" id="reloadMenu">重新加载</button>
        </div>
      </div>
      <div class="header-brand">
        <div class="app-mark" aria-hidden="true">
          <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
            <path fill="#123F91" d="M0 0H240V240H0Z"/>
            <path fill="#fff" d="M58 132C43 132 36 121 39 109C42 97 53 92 65 94C70 72 88 61 107 66C123 69 132 81 135 96C151 91 168 101 170 117C172 133 161 143 145 143H62Z"/>
            <path d="M77 158L106 176L145 156M106 176V195" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
            <path fill="#fff" d="M69 158a8 8 0 1 0 16 0a8 8 0 1 0-16 0M98 176a8 8 0 1 0 16 0a8 8 0 1 0-16 0M137 156a8 8 0 1 0 16 0a8 8 0 1 0-16 0"/>
            <circle cx="173" cy="82" r="10" fill="#FF8A35"/>
            <path d="M174 103Q190 119 174 135" fill="none" stroke="#FF8A35" stroke-width="5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="header-copy">
          <h1>CF 优选助手</h1>
          <p>优选 · 延迟 · 测速 · 订阅</p>
        </div>
      </div>
    </header>

    <div class="card">
      <div class="card-title">选择地区与线路</div>
      <div class="row">
        <select id="regionSelect" aria-label="国家/地区"></select>
        <select id="routeSelect">
          <option value="全部">全部线路</option>
        </select>
      </div>
      <div class="row">
        <input
          id="sourceInput"
          type="url"
          style="width:100%;flex:1;min-width:0"
          value=""
          placeholder="自定义txt数据源网址（删除恢复默认）"
          aria-label="自定义 TXT 数据源网址"
        />
      </div>
      <div class="main-actions">
        <button id="btnLoad">加载列表</button>
        <button id="btnOptimize" disabled>优选延迟</button>
      </div>
      <div class="btn-group selection-actions">
        <button id="btnTop3" class="secondary" disabled>勾选前3</button>
        <button id="btnAppend" class="secondary" disabled>追加上传</button>
        <button id="btnUpload" class="success" disabled>覆盖上传</button>
      </div>
      <div class="status" id="status"></div>
    </div>

    <div class="card manual-card">
      <div class="card-title">手动填写 <span style="font-weight:400">（勾选后随追加/覆盖上传）</span></div>
      <div class="manual-form">
        <div class="manual-check"><input type="checkbox" class="checkbox" id="manualSelect" aria-label="选择手动填写记录上传" /></div>
        <input id="manualIp" class="manual-ip" placeholder="IPv4 / IPv6 / 域名" aria-label="手动 IPv4、IPv6 或域名" />
        <input id="manualPort" inputmode="numeric" placeholder="端口" aria-label="手动端口" />
        <div class="manual-second-row">
          <input id="manualCountry" placeholder="国家" aria-label="手动国家代码，如 JP" />
          <input id="manualRoute" class="manual-route" placeholder="线路" aria-label="手动线路" />
          <div class="manual-measure manual-latency"><input id="manualLatency" inputmode="decimal" placeholder="延迟ms" aria-label="手动延迟，单位毫秒" /></div>
          <div class="manual-measure manual-speed"><input id="manualSpeed" inputmode="decimal" placeholder="速度Mbps" aria-label="手动速度，单位 Mbps" /><div id="manualSpeedStatus" class="manual-speed-status" aria-live="polite"></div></div>
          <div class="manual-action"><button type="button" class="secondary" id="manualSpeedTest">测速</button></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">
        <span>IP 结果</span>
        <span id="countInfo" style="margin-left:auto;font-weight:400"></span>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th><input type="checkbox" class="checkbox" id="checkAll" /></th>
              <th>IP</th>
              <th>端口</th>
              <th>国家</th>
              <th>线路</th>
              <th>延迟</th>
              <th id="speedSortHeader" role="button" tabindex="0" aria-sort="none" title="点击按速度排序">速度 ↕</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="8" class="empty">请先选择地区并加载列表</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <script>
    const API = "";
    let sourceItems = [];
    let allItems = [];
    let currentPage = 1;
    const PAGE_SIZE = 10;
    let selected = new Set();
    let activeTopSelection = null;
    let lastSourceRegion = "JP";
    let speedSortDirection = null;
    let defaultRegions = {};
    let customCountries = false;

    const $ = id => document.getElementById(id);
    const statusEl = $("status");
    const tbody = $("tbody");
    const pagination = $("pagination");
    const countInfo = $("countInfo");

    function setStatus(msg, type = "") {
      statusEl.textContent = msg || "";
      statusEl.className = "status" + (type ? " " + type : "");
    }
    function itemKey(item) { return `${item.ip}:${item.port}`; }
    function formatIpPort(ip, port) {
      const host = String(ip ?? "").trim();
      return `${host.includes(":") && !(host.startsWith("[") && host.endsWith("]")) ? `[${host}]` : host}:${port}`;
    }
    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }
    function selectedCount() {
      return selected.size + ($("manualSelect").checked ? 1 : 0);
    }
    function updateActionButtons() {
      const hasItems = allItems.length > 0;
      const hasSelection = selected.size > 0 || $("manualSelect").checked;
      $("btnOptimize").disabled = !hasItems;
      $("btnTop3").disabled = allItems.length === 0;
      $("btnAppend").disabled = !hasSelection;
      $("btnUpload").disabled = !hasSelection;
    }
    function countryCode(code) {
      const value = String(code || "").trim().toUpperCase();
      return /^[A-Z]{2}$/.test(value) ? value : "";
    }
    function countryCategory(code) {
      return countryCode(code) || "其他";
    }
    function countryLabel(code) {
      const configured = defaultRegions[code]?.name;
      if (configured) return configured;
      try {
        const name = new Intl.DisplayNames(["zh-CN"], { type: "region" }).of(code);
        if (name && name !== code) return `${name} ${code}`;
      } catch {}
      return code;
    }
    function renderRegionOptions(codes, includeOther = false, includeAll = false) {
      const sel = $("regionSelect");
      const previous = sel.value;
      sel.innerHTML = "";
      const list = [...new Set((codes || []).filter(code => code && code !== "其他" && code !== "全部国家"))];
      list.sort((a, b) => {
        const nameA = countryLabel(a).replace(/\s+[A-Z]{2}$/, "");
        const nameB = countryLabel(b).replace(/\s+[A-Z]{2}$/, "");
        return nameA.localeCompare(nameB, "zh-CN") || a.localeCompare(b);
      });
      for (const code of list) {
        const opt = document.createElement("option");
        opt.value = code;
        opt.textContent = countryLabel(code);
        sel.appendChild(opt);
      }
      if (includeOther) {
        const other = document.createElement("option");
        other.value = "其他";
        other.textContent = "其他";
        sel.appendChild(other);
      }
      if (includeAll) {
        const all = document.createElement("option");
        all.value = "全部国家";
        all.textContent = "全部国家";
        sel.appendChild(all);
      }
      if ([...sel.options].some(option => option.value === previous)) sel.value = previous;
      else sel.value = includeAll ? "全部国家" : (list.includes("JP") ? "JP" : (list[0] || "JP"));
    }
    function restoreDefaultRegions() {
      customCountries = false;
      // 日本 JP 是明确的恢复默认值；即使当前数据没有日本记录，也保留该选项。
      renderRegionOptions([...new Set([...Object.keys(defaultRegions), "JP"])], false, false);
      $("regionSelect").value = "JP";
      lastSourceRegion = "JP";
    }
    function showCustomRegions(items) {
      customCountries = true;
      const codes = [...new Set(items.map(item => countryCode(item.country)).filter(Boolean))];
      const includeOther = items.some(item => !countryCode(item.country));
      renderRegionOptions(codes, includeOther, true);
      $("regionSelect").value = "全部国家";
    }
    function updateRouteOptions(routes) {

      const sel = $("routeSelect");
      const previous = sel.value || "全部";
      sel.innerHTML = "";
      const all = document.createElement("option");
      all.value = "全部";
      all.textContent = "全部线路";
      sel.appendChild(all);
      for (const route of routes || []) {
        const opt = document.createElement("option");
        opt.value = route;
        opt.textContent = route;
        sel.appendChild(opt);
      }
      sel.value = (routes || []).includes(previous) ? previous : "全部";
    }
    async function loadRegions() {
      try {
        const r = await fetch(API + "/api/regions");
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || "加载地区失败");
        defaultRegions = data.regions || {};
        restoreDefaultRegions();
        await loadList();
      } catch (e) {
        // 即使地区接口暂时失败，也保留可选的默认日本项。
        restoreDefaultRegions();
        updateRouteOptions([]);
        setStatus("加载地区失败：" + e.message, "error");
      }
    }
    async function loadList() {
      const selectedCountry = $("regionSelect").value || "JP";
      const isDefaultCountry = Object.prototype.hasOwnProperty.call(defaultRegions, selectedCountry);
      const region = isDefaultCountry ? selectedCountry : lastSourceRegion;
      if (isDefaultCountry) lastSourceRegion = selectedCountry;
      setStatus("正在加载列表...");
      $("btnLoad").disabled = true;
      try {
        // 一次拉取该源的全部 IP，线路筛选在完整数据上进行，避免线路选项被筛掉。
        const params = new URLSearchParams({ region, route: "全部" });
        const source = $("sourceInput").value.trim();
        if (source) params.set("source", source);
        const r = await fetch(`${API}/api/list?${params.toString()}`);
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || "加载失败");
        sourceItems = (data.items || []).map(it => ({
          ...it, route: it.route || "none", country: it.country || (source ? "" : region), speedMbps: null, speedError: null, speedStatus: ""
        }));
        const customSource = Boolean(source);
        if (customSource) {
          showCustomRegions(sourceItems);
        } else {
          customCountries = false;
          if (![...$("regionSelect").options].some(option => option.value === $("regionSelect").value)) restoreDefaultRegions();
        }
        const selectedCountryCode = $("regionSelect").value || "JP";
        updateRouteOptions([...new Set(sourceItems.filter(it => selectedCountryCode === "全部国家" || countryCategory(it.country) === selectedCountryCode).map(it => it.route || "none"))]);
        selected.clear();
        activeTopSelection = null;
        speedSortDirection = null;
        $("speedSortHeader").textContent = "速度 ↕";
        $("speedSortHeader").setAttribute("aria-sort", "none");
        applyRouteFilter(false);
        const total = Number(data.total ?? sourceItems.length);
        if (!sourceItems.length) setStatus("该地区没有有效 IP，列表为空。", "ok");
        else setStatus(`数据源共 ${total} 个有效 IP，当前筛选 ${allItems.length} 个`, "ok");
      } catch (e) {
        sourceItems = [];
        allItems = [];
        updateRouteOptions([]);
        selected.clear();
        activeTopSelection = null;
        currentPage = 1;
        render();
        updateActionButtons();
        setStatus(e.message || "加载失败", "error");
      } finally {
        $("btnLoad").disabled = false;
      }
    }
    function applyRouteFilter(clearSelection = true) {
      const route = $("routeSelect").value || "全部";
      const country = $("regionSelect").value || "JP";
      allItems = sourceItems.filter(it => (country === "全部国家" || countryCategory(it.country) === country) && (route === "全部" || (it.route || "none") === route));
      if (clearSelection) {
        selected.clear();
        activeTopSelection = null;
      }
      currentPage = 1;
      speedSortDirection = null;
      $("speedSortHeader").textContent = "速度 ↕";
      $("speedSortHeader").setAttribute("aria-sort", "none");
      render();
      updateActionButtons();
      setStatus(allItems.length ? `当前线路共 ${allItems.length} 个 IP` : "当前线路没有有效 IP，列表为空。", "ok");
    }
    async function optimize() {
      if (!allItems.length) return;
      setStatus(`正在优选延迟（并发16，共 ${allItems.length} 个）...`);
      const optimizeButton = $("btnOptimize");
      optimizeButton.disabled = true;
      optimizeButton.classList.add("optimizing");
      try {
        const r = await fetch(API + "/api/optimize", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ items: allItems })
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || "优选失败");
        // 后端只返回 TCP 连接成功的 IP；勾选状态只保留仍存活的项目。
        allItems = (data.items || []).map(it => ({ ...it, speedMbps: null, speedError: null, speedStatus: "" }));
        sourceItems = allItems.slice();
        const aliveKeys = new Set(allItems.map(itemKey));
        selected = new Set([...selected].filter(key => aliveKeys.has(key)));
        activeTopSelection = null;
        currentPage = 1;
        speedSortDirection = null;
        $("speedSortHeader").textContent = "速度 ↕";
        $("speedSortHeader").setAttribute("aria-sort", "none");
        render();
        updateActionButtons();
        setStatus(`优选完成：连接成功 ${data.alive || allItems.length} / 测试 ${data.count ?? allItems.length}，已隐藏连接失败的 IP`, "ok");
      } catch (e) {
        setStatus(e.message || "优选失败", "error");
      } finally {
        optimizeButton.classList.remove("optimizing");
        optimizeButton.disabled = allItems.length === 0;
      }
    }
    function selectTop(n) {
      // 前 3 / 前 5 互斥：点击另一项时只保留对应数量；再次点击当前项则清空。
      // 自动选择只作用于普通结果列表，手动填写行的勾选状态保持不变。
      currentPage = 1;
      if (activeTopSelection === n) {
        selected.clear();
        activeTopSelection = null;
        render();
        setStatus("已取消自动勾选", "ok");
        updateActionButtons();
        return;
      }
      selected.clear();
      activeTopSelection = n;
      allItems.slice(0, Math.min(n, PAGE_SIZE)).forEach(it => selected.add(itemKey(it)));
      render();
      setStatus(`已勾选第一页前 ${Math.min(n, allItems.length, PAGE_SIZE)} 个`, "ok");
      updateActionButtons();
    }
    function manualAddress() {
      let host = $("manualIp").value.trim();
      let portText = $("manualPort").value.trim();
      if (!host) throw new Error("请先填写 IP 或域名");
      let embeddedPort = "";
      if (host.startsWith("[")) {
        const match = host.match(/^\[([^\]]+)\](?::(\d+))?$/);
        if (!match) throw new Error("IPv6 地址格式不正确");
        host = match[1]; embeddedPort = match[2] || "";
      } else {
        const colons = (host.match(/:/g) || []).length;
        if (colons === 1) {
          const match = host.match(/^(.+):(\d+)$/);
          if (match) { host = match[1]; embeddedPort = match[2]; }
        }
        // 多个冒号视为未加方括号的 IPv6 地址，避免把 IPv6 尾段误当端口。
      }
      const port = portText || embeddedPort || "443";
      if (!/^\d+$/.test(port) || Number(port) < 1 || Number(port) > 65535) throw new Error("端口必须是 1–65535 的数字");
      const isIPv6 = host.includes(":") && /^[0-9a-fA-F:.]+$/.test(host);
      const ipv4Shape = /^(?:\d{1,3}\.){3}\d{1,3}$/.test(host);
      const isIPv4 = ipv4Shape && host.split(".").every(part => Number(part) >= 0 && Number(part) <= 255);
      const isDomain = host.length <= 253 && /^(?=.{1,253}$)(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)(?:\.(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?))*$/.test(host) && !ipv4Shape;
      if (!(isIPv6 || isIPv4 || isDomain)) throw new Error("请输入有效的 IPv4、IPv6 或域名");
      const displayHost = isIPv6 ? `[${host}]` : host;
      return { ip: host, port, ipPort: `${displayHost}:${port}` };
    }
    function manualLine() {
      const addr = manualAddress();
      const country = $("manualCountry").value.trim().toUpperCase();
      const route = $("manualRoute").value.trim();
      const latencyRaw = $("manualLatency").value.trim();
      const speedRaw = $("manualSpeed").value.trim();
      const latencyNum = latencyRaw.match(/^([0-9]+(?:\.[0-9]+)?)(?:\s*ms)?$/i);
      const speedNum = speedRaw.match(/^([0-9]+(?:\.[0-9]+)?)(?:\s*mbps)?$/i);
      if (latencyRaw && !latencyNum) throw new Error("延迟请输入数字，单位默认为 ms");
      if (speedRaw && !speedNum) throw new Error("速度请输入数字，单位默认为 Mbps");
      const latency = latencyNum ? `${latencyNum[1]}ms` : "";
      const speed = speedNum ? `${speedNum[1]}Mbps` : "";
      const metrics = [latency, speed].filter(Boolean).join(" ");
      return `${addr.ipPort}#自选 | ${country} | ${route} |${metrics ? ` ${metrics}` : ""} ${metrics ? "| " : ""}${addr.ipPort}`;
    }
    function testManualSpeed() {
      try {
        const addr = manualAddress();
        const item = { ip: addr.ip, port: Number(addr.port), country: $("manualCountry").value.trim(), route: $("manualRoute").value.trim() || "none", manual: true, speedMbps: null, speedError: null, speedStatus: "" };
        speedTest(item);
      } catch (e) { setStatus(e.message || "无法测速", "error"); }
    }
    async function upload(mode = "overwrite") {
      const includeManual = $("manualSelect").checked;
      if (selected.size === 0 && !includeManual) return;
      const lines = [];
      if (includeManual) {
        try { lines.push(manualLine()); }
        catch (e) { setStatus(e.message || "手动填写记录无效", "error"); return; }
      }
      allItems.forEach(it => {
        if (!selected.has(itemKey(it))) return;
        const ipPort = formatIpPort(it.ip, it.port);
        const route = it.route || "none";
        const country = String(it.country || "").toUpperCase();
        const latency = it.latencyMs != null ? `${it.latencyMs}ms` : "";
        const speed = Number.isFinite(it.speedMbps) ? `${it.speedMbps.toFixed(1)}Mbps` : "";
        const metrics = [latency, speed].filter(Boolean).join(" ");
        lines.push(`${ipPort}#自选 | ${country} | ${route} |${metrics ? ` ${metrics}` : ""} ${metrics ? "| " : ""}${ipPort}`);
      });
      if (!lines.length) {
        setStatus("当前结果中没有可上传的已选 IP，请重新加载后选择。", "error");
        return;
      }
      if (lines.some(line => line.includes("\uFFFD"))) {
        setStatus("上传文本已包含乱码替换字符，请检查页面文件编码后重试。", "error");
        return;
      }
      const actionName = mode === "append" ? "追加上传" : "覆盖上传";
      setStatus(mode === "append" ? "正在读取服务器内容并准备追加..." : "正在覆盖上传...");
      $("btnAppend").disabled = true;
      $("btnUpload").disabled = true;
      try {
        const r = await fetch(API + "/api/upload", {
          method: "POST",
          headers: { "Content-Type": "application/json; charset=utf-8" },
          body: JSON.stringify({ text: lines.join("\n"), mode })
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || data.detail || `${actionName}失败`);
        if (mode === "append" && data.added === 0) setStatus("没有新增 IP，服务器内容未修改", "ok");
        else setStatus(`${actionName}成功，共 ${data.count ?? lines.length} 个 IP${mode === "append" && data.added != null ? `，新增 ${data.added} 个` : ""}`, "ok");
      } catch (e) {
        setStatus(e.message || `${actionName}失败`, "error");
      } finally {
        updateActionButtons();
      }
    }
    function updateItemSpeedView(item) {
      const key = itemKey(item);
      if (item.manual) {
        const speedInput = $("manualSpeed");
        const speedStatus = $("manualSpeedStatus");
        if (item.speedStatus) {
          speedStatus.textContent = item.speedStatus;
          setStatus("手动行：" + item.speedStatus);
        } else if (item.speedMbps != null) {
          // 仅将真实测速结果写入数值框；状态显示在页面已有的状态栏，手动栏保持两行。
          speedInput.value = item.speedMbps.toFixed(1);
          speedStatus.textContent = "测速完成（Mbps）";
          setStatus("手动行测速完成：" + item.speedMbps.toFixed(1) + " Mbps", "ok");
        } else if (item.speedError) {
          speedStatus.textContent = item.speedError;
          setStatus("手动行测速失败：" + item.speedError, "error");
        } else {
          speedStatus.textContent = "";
        }
        return;
      }
      const row = [...tbody.querySelectorAll("tr[data-key]")].find(el => el.dataset.key === key);
      if (!row) return;
      const cell = row.querySelector(".speed-cell");
      if (!cell) return;
      if (item.speedStatus) cell.textContent = item.speedStatus;
      else if (item.speedMbps != null) cell.textContent = item.speedMbps.toFixed(1) + " Mbps";
      else if (item.speedError) cell.textContent = item.speedError;
      else cell.textContent = "-";
    }
    function sortBySpeed() {
      speedSortDirection = speedSortDirection === "desc" ? "asc" : "desc";
      const dir = speedSortDirection === "desc" ? -1 : 1;
      allItems.sort((a, b) => {
        const av = Number.isFinite(a.speedMbps) ? a.speedMbps : null;
        const bv = Number.isFinite(b.speedMbps) ? b.speedMbps : null;
        if (av == null && bv == null) return 0;
        if (av == null) return 1;
        if (bv == null) return -1;
        return (av - bv) * dir;
      });
      currentPage = 1;
      $("speedSortHeader").textContent = speedSortDirection === "desc" ? "速度 ↓" : "速度 ↑";
      $("speedSortHeader").setAttribute("aria-sort", speedSortDirection === "desc" ? "descending" : "ascending");
      render();
    }
    async function speedTest(item) {
      item.speedStatus = "测速中...";
      item.speedError = null;
      item.speedMbps = null;
      updateItemSpeedView(item);
      const controller = new AbortController();
      let timedOut = false;
      let gotDone = false;
      const timer = setTimeout(() => {
        timedOut = true;
        controller.abort();
        item.speedStatus = "";
        item.speedError = "测速超时（10秒）";
        updateItemSpeedView(item);
      }, 10000);
      try {
        const res = await fetch(API + "/api/speed", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ item }), signal: controller.signal
        });
        if (!res.ok) {
          const detail = await res.json().catch(() => ({}));
          throw new Error(detail.error || "测速失败");
        }
        if (!res.body) throw new Error("浏览器不支持流式测速");
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        const handlePart = part => {
          const line = part.trim().split(/\r?\n/).find(x => x.startsWith("data:"));
          if (!line) return;
          try {
            const data = JSON.parse(line.slice(5).trim());
            if (data.type === "progress") {
              item.speedStatus = `${Number(data.currentMbps || 0).toFixed(1)} Mbps…`;
              updateItemSpeedView(item);
            } else if (data.type === "done") {
              gotDone = true;
              item.speedStatus = "";
              if (data.ok && Number.isFinite(Number(data.avgMbps))) {
                item.speedMbps = Number(data.avgMbps);
                item.speedError = null;
              } else {
                item.speedMbps = null;
                item.speedError = data.error || "测速失败";
              }
              updateItemSpeedView(item);
            }
          } catch {}
        };
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n\n");
          buffer = parts.pop() || "";
          for (const part of parts) handlePart(part);
        }
        buffer += decoder.decode();
        if (buffer.trim()) handlePart(buffer);
        if (!timedOut && !gotDone) {
          item.speedStatus = "";
          item.speedError = "测速连接结束，但未收到结果";
          updateItemSpeedView(item);
        }
      } catch (e) {
        if (!timedOut) {
          item.speedStatus = "";
          item.speedError = e.name === "AbortError" ? "测速已取消" : (e.message || "测速失败");
          updateItemSpeedView(item);
        }
      } finally {
        clearTimeout(timer);
        if (speedSortDirection) {
          const dir = speedSortDirection === "desc" ? -1 : 1;
          allItems.sort((a, b) => {
            const av = Number.isFinite(a.speedMbps) ? a.speedMbps : null;
            const bv = Number.isFinite(b.speedMbps) ? b.speedMbps : null;
            if (av == null && bv == null) return 0;
            if (av == null) return 1;
            if (bv == null) return -1;
            return (av - bv) * dir;
          });
          currentPage = 1;
          render();
        }
      }
    }
    function render() {
      const total = allItems.length;
      const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
      currentPage = Math.min(Math.max(1, currentPage), pages);
      const start = (currentPage - 1) * PAGE_SIZE;
      const pageItems = allItems.slice(start, start + PAGE_SIZE);
      countInfo.textContent = total ? `共 ${total} 个 · 已选 ${selectedCount()}` : (selectedCount() ? `共 0 个 · 已选 ${selectedCount()}` : "共 0 个");
      if (!pageItems.length) {
        tbody.innerHTML = '<tr><td colspan="8" class="empty">暂无有效 IP</td></tr>';
      } else {
        tbody.innerHTML = pageItems.map(it => {
          const key = itemKey(it);
          const checked = selected.has(key) ? "checked" : "";
          const latency = it.latencyMs != null
            ? `<span class="badge ${it.ok ? "ok" : "fail"}">${escapeHtml(it.latencyMs)} ms</span>`
            : (it.error ? `<span class="badge fail">${escapeHtml(it.error)}</span>` : "-");
          const speed = it.speedStatus ? escapeHtml(it.speedStatus)
            : (it.speedMbps != null ? `${it.speedMbps.toFixed(1)} Mbps`
              : (it.speedError ? escapeHtml(it.speedError) : "-"));
          return `<tr data-key="${escapeHtml(key)}">
            <td><input type="checkbox" class="checkbox row-check" data-key="${escapeHtml(key)}" ${checked} aria-label="选择 ${escapeHtml(key)}" /></td>
            <td class="ip">${escapeHtml(it.ip)}</td>
            <td class="num">${escapeHtml(it.port)}</td>
            <td><span class="badge">${escapeHtml(it.country || "其他")}</span></td>
            <td><span class="badge">${escapeHtml(it.route || "none")}</span></td>
            <td class="num">${latency}</td>
            <td class="num speed-cell">${speed}</td>
            <td class="actions"><button class="secondary btn-speed" data-key="${escapeHtml(key)}">测速</button></td>
          </tr>`;
        }).join("");
      }
      const pagesHtml = [];
      if (pages > 1) {
        pagesHtml.push(`<button class="secondary" data-page="${currentPage - 1}" ${currentPage <= 1 ? "disabled" : ""}>上一页</button>`);
        let nums = new Set([1, pages, currentPage - 2, currentPage - 1, currentPage, currentPage + 1, currentPage + 2]);
        let previous = 0;
        for (const page of [...nums].filter(n => n >= 1 && n <= pages).sort((a, b) => a - b)) {
          if (previous && page - previous > 1) pagesHtml.push("<span>…</span>");
          pagesHtml.push(`<button class="${page === currentPage ? "" : "secondary"}" data-page="${page}" ${page === currentPage ? "disabled aria-current=\"page\"" : ""}>${page}</button>`);
          previous = page;
        }
        pagesHtml.push(`<button class="secondary" data-page="${currentPage + 1}" ${currentPage >= pages ? "disabled" : ""}>下一页</button>`);
      } else if (total) {
        pagesHtml.push(`<span>第 1 / 1 页</span>`);
      }
      pagination.innerHTML = pagesHtml.join("");
      const pageKeys = pageItems.map(itemKey);
      const checkedCount = pageKeys.filter(key => selected.has(key)).length;
      $("checkAll").checked = pageKeys.length > 0 && checkedCount === pageKeys.length;
      $("checkAll").indeterminate = checkedCount > 0 && checkedCount < pageKeys.length;
      tbody.querySelectorAll(".row-check").forEach(cb => {
        cb.onchange = () => {
          if (cb.checked) selected.add(cb.dataset.key);
          else selected.delete(cb.dataset.key);
          updateActionButtons();
          countInfo.textContent = total ? `共 ${total} 个 · 已选 ${selectedCount()}` : (selectedCount() ? `共 0 个 · 已选 ${selectedCount()}` : "共 0 个");
          const currentKeys = pageItems.map(itemKey);
          const n = currentKeys.filter(key => selected.has(key)).length;
          $("checkAll").checked = currentKeys.length > 0 && n === currentKeys.length;
          $("checkAll").indeterminate = n > 0 && n < currentKeys.length;
        };
      });
      tbody.querySelectorAll(".btn-speed").forEach(btn => {
        btn.onclick = () => {
          const item = allItems.find(x => itemKey(x) === btn.dataset.key);
          if (item) speedTest(item);
        };
      });
      pagination.querySelectorAll("button[data-page]").forEach(btn => {
        btn.onclick = () => {
          const page = Number(btn.dataset.page);
          if (Number.isInteger(page) && page >= 1 && page <= pages) {
            currentPage = page;
            render();
          }
        };
      });
      updateActionButtons();
    }
    $("checkAll").onchange = () => {
      const checked = $("checkAll").checked;
      const start = (currentPage - 1) * PAGE_SIZE;
      const pageItems = allItems.slice(start, start + PAGE_SIZE);
      pageItems.forEach(item => {
        const key = itemKey(item);
        if (checked) selected.add(key);
        else selected.delete(key);
      });
      render();
    };
    $("manualSelect").onchange = () => {
      updateActionButtons();
      countInfo.textContent = allItems.length ? `共 ${allItems.length} 个 · 已选 ${selectedCount()}` : (selectedCount() ? `共 0 个 · 已选 ${selectedCount()}` : "共 0 个");
    };
    $("manualSpeedTest").onclick = testManualSpeed;
    $("btnLoad").onclick = loadList;
    $("regionSelect").onchange = () => {
      const country = $("regionSelect").value;
      $("routeSelect").value = "全部";
      if ($("sourceInput").value.trim() || country === "其他" || country === "全部国家") {
        // 自定义 TXT 中仅切换当前数据的国家分类，不重新请求数据。
        updateRouteOptions([...new Set(sourceItems.filter(it => country === "全部国家" || countryCategory(it.country) === country).map(it => it.route || "none"))]);
        applyRouteFilter();
      } else {
        lastSourceRegion = country;
        loadList();
      }
    };
    $("sourceInput").addEventListener("change", () => {
      if (!$("sourceInput").value.trim() && customCountries) {
        restoreDefaultRegions();
        updateRouteOptions([]);
        loadList();
      }
    });
    $("routeSelect").onchange = () => applyRouteFilter();
    $("btnOptimize").onclick = optimize;
    $("btnTop3").onclick = () => selectTop(3);
    $("btnAppend").onclick = () => upload("append");
    $("btnUpload").onclick = () => upload("overwrite");
    $("speedSortHeader").onclick = sortBySpeed;
    $("speedSortHeader").onkeydown = event => {
      if (event.key === "Enter" || event.key === " ") { event.preventDefault(); sortBySpeed(); }
    };
    loadRegions();
  </script>
<script>
(() => {
  const trigger = document.getElementById('appMenuButton');
  const menu = document.getElementById('appMenu');
  const closeMenu = () => { menu.classList.remove('open'); trigger.setAttribute('aria-expanded', 'false'); };
  trigger.addEventListener('click', (event) => { event.stopPropagation(); const open = menu.classList.toggle('open'); trigger.setAttribute('aria-expanded', String(open)); });
  document.addEventListener('click', closeMenu);
  menu.addEventListener('click', (event) => event.stopPropagation());
  document.getElementById('uploadConfigMenu').addEventListener('click', () => { closeMenu(); if (window.AndroidApp && AndroidApp.uploadConfig) AndroidApp.uploadConfig(); });
  document.getElementById('reloadMenu').addEventListener('click', () => { closeMenu(); if (window.AndroidApp && AndroidApp.reloadPage) AndroidApp.reloadPage(); else location.reload(); });
})();
</script>
